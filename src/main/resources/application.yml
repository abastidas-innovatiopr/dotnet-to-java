# ============================================================================
# Base configuration. Profile-specific files override individual keys:
#   application-local.yml  developer machine (docker compose PostgreSQL, seed data)
#   application-test.yml   integration tests (Testcontainers PostgreSQL)
#
# The .NET equivalent is appsettings.json plus appsettings.{Environment}.json.
# Secrets come from environment variables and are never committed.
# ============================================================================

spring:
  application:
    name: payments-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DATABASE_USERNAME:payments}
    password: ${DATABASE_PASSWORD:payments}
    hikari:
      pool-name: payments-pool
      # Transfers hold row locks for the length of a transaction. A pool far larger than the database
      # can usefully serve just moves the queue from the pool to PostgreSQL.
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    open-in-view: false          # No lazy loading during view rendering. Every query is deliberate.
    hibernate:
      ddl-auto: validate         # Flyway owns the schema. Hibernate only checks that it matches.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        # Fails startup if a query would be paginated in memory rather than in SQL.
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        # Jackson 3 (the default in Spring Boot 4) moved the date/time toggles out of
        # SerializationFeature into DateTimeFeature, so this is no longer
        # spring.jackson.serialization.write-dates-as-timestamps. ISO-8601 strings, not epoch millis.
        write-dates-as-timestamps: false
    serialization:
      indent-output: false

  threads:
    virtual:
      # Java 21+ virtual threads. Request handling is dominated by waiting on PostgreSQL, which is
      # exactly the workload they help: a blocked virtual thread does not pin a platform thread.
      enabled: true

  modulith:
    events:
      jdbc:
        # Flyway owns this schema too (V2__create_event_publication.sql), so Modulith must not try to
        # create it - otherwise ddl-auto=validate and the migration history would disagree.
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never       # Error bodies are RFC 9457 Problem Details produced by our own mapper.
    include-stacktrace: never
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false               # Scalar is the documentation UI; it is mounted at /docs.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # Sample everything in development. Lower it in production, where trace volume costs money.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.innovatiopr.payments: ${LOG_LEVEL:INFO}
  pattern:
    # correlationId ties a client's request to its log lines; traceId/spanId tie them to a trace.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] %-40.40logger{39} : %m%n"
