# Integration tests. The datasource URL is supplied by Testcontainers at runtime through
# @ServiceConnection, so nothing is hard-coded here.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

logging:
  level:
    root: WARN
    com.innovatiopr.payments: INFO
    org.springframework.modulith: INFO
