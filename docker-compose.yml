# Local development stack. PostgreSQL and nothing else - no cloud, no broker, no cache.
#
#   docker compose up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

services:
  postgres:
    image: postgres:18-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 changed this. Earlier images took the volume at
      # /var/lib/postgresql/data; 18+ expects it one level up at /var/lib/postgresql and
      # places the cluster in a version-named subdirectory, so that pg_upgrade --link can
      # work without crossing a mount boundary. Mounting the old path makes the container
      # exit at startup with "PostgreSQL data in /var/lib/postgresql/data (unused
      # mount/volume)" - which is easy to misread as a corrupt volume rather than a
      # misplaced mount.
      - payments-postgres-data:/var/lib/postgresql
    healthcheck:
      # The application waits for this, so it must test a real query rather than just the port.
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Optional: run the API itself in Docker with `docker compose --profile app up -d`.
  # The default `docker compose up -d` starts only PostgreSQL, which is what you want while
  # developing - the application then runs from your IDE or ./mvnw with fast restarts.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payments-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/payments
      DATABASE_USERNAME: payments
      DATABASE_PASSWORD: payments
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  payments-postgres-data:
